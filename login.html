<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Admin</title>
    <link rel="stylesheet" href="misc/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      window.history.replaceState({}, "", "/login");
    </script>
  </head>
  <body>

    <main id="detalhes" style="max-width: 450px; margin-top: 100px;">
      
      <div style="margin-bottom: 30px;">
        <h2>Acesso Restrito</h2>
      </div>

      <div class="form-grupo" style="margin-bottom: 20px; text-align: left;">
        <label for="input-user" style="font-weight: bold; margin-bottom: 8px; display: block;">Nome de usuário</label>
        <input
          type="text"
          id="input-user"
          placeholder="Digite seu usuário..."
          autocomplete="username"
          style="width: 100%; padding: 12px; border: 2px solid var(--primary); border-radius: 8px; outline: none; font-family: 'JetBrains Mono', monospace;"
        />
      </div>

      <div class="form-grupo" style="margin-bottom: 30px; text-align: left;">
        <label for="input-senha" style="font-weight: bold; margin-bottom: 8px; display: block;">Senha</label>
        <input
          type="password"
          id="input-senha"
          placeholder="Digite sua senha..."
          autocomplete="current-password"
          style="width: 100%; padding: 12px; border: 2px solid var(--primary); border-radius: 8px; outline: none; font-family: 'JetBrains Mono', monospace;"
        />
      </div>

      <div class="botoes-grupo">
        <button class="btn-primary" onclick="loginUsuario()" style="width: 100%; font-size: 16px;">ENTRAR</button>
        <p id="mensagem-aviso" style="color: #ff4444; margin-top: 15px; font-weight: bold;"></p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
