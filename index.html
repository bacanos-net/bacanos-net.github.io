<!DOCTYPE html>
<html>
<head>
    <title>UGS Files</title>
<style>
    :root {
        --primary: #aaff00;
        --primary-hover: #7ee500;
        --bg-light: #eaffd0;
        --dark: #1a1a1a;
        --text-dark: #222;
        --text-muted: #555;
        --white: #ffffff;
        --shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        --shadow-hover: 0 12px 32px rgba(122, 255, 0, 0.15);
        --transition: 0.2s ease-in-out;
        --radius: 18px;
    }

    body {
        font-family: "JetBrains Mono", monospace;
        background: linear-gradient(120deg, #f4f4f4 70%, var(--bg-light) 100%);
        color: var(--text-dark);
        line-height: 1.6;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        display: flex;
    }

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 80px;
        height: 100vh;
        background: var(--dark);
        border-right: 4px solid var(--primary);
        padding: 20px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        box-shadow: var(--shadow);
        z-index: 1000;
    }

    .sidebar::-webkit-scrollbar {
        width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
        background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
        background: var(--bg-light);
        border-radius: 10px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
    }

    .sidebar-btn {
        background: var(--dark);
        border: none;
        padding: 12px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 5px;
        cursor: pointer;
        transition: var(--transition);
        color: var(--white);
        text-align: center;
        min-height: 45px;
    }

    .sidebar-btn:hover {
        background: var(--primary);
        color: var(--text-dark);
        transform: translateY(-2px);
    }

    .sidebar-btn.empty {
        opacity: 0.4;
        cursor: default;
    }

    .sidebar-btn.empty:hover {
        transform: none;
        background: var(--dark);
        color: var(--white);
    }

    .main-content {
        margin-left: 100px;
        flex: 1;
        padding: 20px;
    }

    h1 {
        color: var(--text-dark);
        text-align: center;
        margin-bottom: 30px;
        font-size: clamp(24px, 5vw, 38px);
    }

    .letter-section {
        margin-bottom: 40px;
        padding: 0 20px;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
        min-height: 100px;
    }

    .letter-section.empty {
        opacity: 0.5;
    }

    .letter-header {
        color: var(--text-dark);
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 3px solid var(--primary);
    }

    .buttons-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
    }

    .empty-message {
        color: var(--text-muted);
        font-style: italic;
        text-align: center;
        padding: 20px;
    }

    input[type="button"] {
        background-color: var(--primary);
        color: var(--text-dark);
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition: var(--transition);
        width: 100%;
        max-width: 600px;
        text-align: center;
    }

    input[type="button"]:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
        background-color: var(--primary-hover);
    }

    input[type="button"]:active {
        transform: translateY(0);
        box-shadow: var(--shadow);
    }

    @media (max-width: 768px) {
        .sidebar {
            width: 60px;
            padding: 15px 5px;
        }
        .sidebar-btn {
            padding: 8px;
            font-size: 16px;
        }
        .main-content {
            margin-left: 70px;
        }
    }
</style>
</head>
